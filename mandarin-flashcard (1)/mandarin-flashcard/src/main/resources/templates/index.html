<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mandarin Web Flashcard</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
    <style>
        .card-box { width: 350px; height: 250px; cursor: pointer; perspective: 1000px; }
        .card-inner { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        .card-box.flipped .card-inner { transform: rotateY(180deg); }
        .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; border-radius: 15px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); }
        .card-front { background-color: #ffffff; border: 2px solid #dc3545; }
        .card-back { background-color: #dc3545; color: white; transform: rotateY(180deg); }
    </style>
</head>
<body class="bg-light d-flex flex-column align-items-center justify-content-center vh-100">

<div class="text-center mb-4">
    <h2 class="fw-bold text-dark">🎴 Mandarin Flashcard</h2>
    <p class="text-muted">Asah kemampuan bahasa Mandarin Anda dengan kartu interaktif</p>
</div>

<div th:if="${errorMessage}" class="alert alert-warning" role="alert" th:text="${errorMessage}"></div>

<div th:if="${card != null}" class="card-box" onclick="this.classList.toggle('flipped')">
    <div class="card-inner">
        <div class="card-front">
            <h1 class="display-1 fw-bold text-danger" th:text="${card.hanzi}">谢谢</h1>
            <small class="text-muted position-absolute bottom-0 mb-3">💡 Klik untuk melihat arti</small>
        </div>
        <div class="card-back text-center p-3">
            <span class="badge bg-white text-danger mb-2">Pinyin</span>
            <h2 class="fw-bold mb-3" th:text="${card.pinyin}">Xièxie</h2>
            <hr class="w-50 mx-auto border-white">
            <span class="badge bg-white text-danger mb-2">Arti</span>
            <h3 class="fw-normal" th:text="${card.arti}">Terima kasih</h3>
        </div>
    </div>
</div>

<div class="mt-4">
    <a href="/" class="btn btn-danger btn-lg px-5 shadow-sm rounded-pill">Kartu Selanjutnya ➡️</a>
</div>

</body>
</html>
